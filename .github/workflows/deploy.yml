name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read        # read repo files only
  pages: write          # upload Pages artifact
  id-token: write       # OIDC token for trusted Pages deployment

concurrency:
  group: pages
  cancel-in-progress: false  # never cancel an in-flight deploy mid-publish

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token written to disk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .                      # deploy repo root (index.html lives here)

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
